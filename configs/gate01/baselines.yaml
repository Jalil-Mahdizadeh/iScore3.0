schema_version: 1
experiment_id: gate01-shallow-controls-v1
status: frozen_before_first_baseline_fit
endpoint: pKd
primary_split: union_component_leave_one_out
secondary_split: stratified_random_pair_5fold_non_headline
random_seed: 20260820
union_edges:
  exact_construct: true
  exact_bemis_murcko_scaffold: true
  morgan_radius2_tanimoto_at_least: 0.35
  full_sequence_global_identity_at_least: 0.30
  local_site_sequence_identity_at_least: 0.50
  shared_primary_doi_or_pubmed: true
  validated_pocket_structure_edge: unavailable_gate01_limitation
ligand_features:
  ecfp_radius: 2
  ecfp_bits: 2048
  gmolai_dimensions: 384
protein_features:
  full_sequence: amino_acid_and_dipeptide_composition
  pocket_composition: residue_element_counts_without_geometry
  pocket_structure: transparent_52d_rigid_motion_invariant_descriptors
models:
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  ridge_solver: lsqr
  knn_k: 3
  knn_weight_power: 2.0
  additive_fusion: equal_weight_prediction_average
preprocessing:
  standardization: fit_training_fold_only
  ridge_selection: nested_leave_one_construct_out_within_outer_train
  missing_values: forbidden
bootstrap:
  unit: construct_union_component
  replicates: 5000
  seed: 20260820
gate_decision:
  required_view: S1
  comparator: matched_ligand_only
  minimum_pooled_rmse_reduction_pkd: 0.10
  paired_component_bootstrap_95pct_must_exclude_no_improvement: true
  interpretation: exploratory_due_only_six_independent_components
