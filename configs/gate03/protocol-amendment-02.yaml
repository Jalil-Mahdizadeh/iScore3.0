schema_version: 1
phase_id: gate03-bounded-interaction-identifiability-v1
amendment_id: gate03-amendment-02-scaffold-evaluation-coverage
status: frozen_before_first_gate03_fit
frozen_utc: 2026-08-21T09:29:36Z
model_outcomes_inspected_before_freeze: false
reason: >
  Under the frozen exact-Murcko-or-ECFP4-0.35 connected-component rule, 93 of
  224 strict mapped candidates have at least one eligible held-out scaffold
  cluster. Only 16 such candidates can be mutually disconnected before adding
  structural edges, so requiring all 30--50 final components to be scaffold
  evaluable is mathematically infeasible without weakening leakage controls.
  Selection will instead maximize scaffold-evaluable coverage subject to the
  unchanged independence and mapping rules.
selection_objective:
  order:
    - largest_independent_set_size
    - most_series_with_eligible_scaffold_OOD_fold
    - most_eligible_scaffold_OOD_folds
    - highest_predeclared_assay_and_mapping_quality
    - lexical_series_ids
  clustering_rule_unchanged: exact_nonempty_murcko_or_ECFP4_tanimoto_0.35_components
additional_dataset_gate:
  minimum_final_independent_series: 30
  minimum_final_series_with_eligible_scaffold_OOD_fold: 10
  minimum_final_eligible_scaffold_OOD_folds: 20
  minimum_scaffold_test_ligands: 2
  minimum_scaffold_training_ligands: 6
  on_failure: DATA-NO-GO_without_model_efficacy_fit
interpretation:
  within_target_metrics_are_reported_only_on_eligible_folds: true
  target_macro_bootstrap_unit: assay_series
  do_not_generalize_ranking_result_beyond_scaffold_evaluable_series: true
