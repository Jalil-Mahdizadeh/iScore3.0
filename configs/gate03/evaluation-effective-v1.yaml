schema_version: 1
phase_id: gate03-evaluation-effective-v1
status: frozen_before_first_gate03_efficacy_fit
frozen_utc: 2026-08-21T11:26:00Z
efficacy_model_outcomes_inspected: false

scope:
  full_cross_attention_allowed: false
  ligand_coordinates_allowed: false
  primary_interaction_family: regularized_bilinear
  secondary_interaction_family: FiLM_gating
  secondary_family_can_rescue_primary_failure: false

inputs:
  dataset:
    path: data/processed/gate03/gate03-strict-kd-v3.tsv
    sha256: 785a304e88197da725e891c4701a2fc7ad1ae4ea14413bf7fec7e98fe23415c7
  splits:
    path: data/splits/gate03/gate03-component-scaffold-splits-v3.tsv
    sha256: cdc6a29984ad276b0c2c1cacc7b7af68925fe9bd125a7a73a616ca32d0a088d8
  representation_contract_sha256: 159430ab937f0dbe47af2e951c21422c0df6fc664ee5c1110a1b2b49ffd7d888
  pocket_S1_S2_sha256: 0c6607c86cc0424f69ecd6360b2d15b418d756f5fc3540a74958624dd4e68470
  pocket_S3_sha256: fb2c4301ed16ffc3fe22cc337b7efbc534412b01251ad989ac5d49815ed09a9e
  esm_if1_manifest_sha256: 920db6101b552d092670762a4fd7f2e82b7f1e792ea1f361c585de25eec07408
  esm2_manifest_sha256: 291142c46c347459d798631e5cf7cbb69679bb0690142220f0f45f9321dd7842
  gmolai_manifest_sha256: acb4fd21448c09afcd9aaf31aa90b6bcd804dc33ce3065087e3f24323aeb48d1
  S1_structural_allpairs_sha256: 05c84ba3ee21d7873036e24f201b9a0b7e10e538ede65f723e1c43bd3835eaa4

views:
  S1: primary_all_34_series
  S2: required_non_holo_replication_32_series
  S3: sensitivity_only_7_series
  complete_case_per_view: true
  never_impute_missing_receptor_view: true

features:
  ECFP:
    radius: 2
    bits: 2048
    use_counts: false
    input_coordinates_allowed: false
  matched_interaction_projection:
    type: fixed_label_independent_gaussian_random_projection
    ligand_dimensions: 64
    receptor_dimensions: 16
    sequence_dimensions: 16
    seed_ligand: 3101
    seed_pocket_descriptor: 3102
    seed_esm_if1: 3103
    seed_sequence: 3104
    scaling: training_fold_only_standard_scaler
  full_additive_controls_use_unprojected_blocks: true

outer_evaluation:
  absolute:
    split: leave_one_frozen_component_out
    response: absolute_pKd
    expected_folds: 34
    metrics: [RMSE, MAE, Pearson, component_macro_RMSE, component_macro_MAE]
  scaffold:
    split: leave_one_precomputed_eligible_scaffold_cluster_out_within_series
    expected_folds: 22
    response: within_series_pKd_minus_training_only_series_mean
    training_response_centring: each_training_series_uses_its_fold_local_mean
    test_response_centring: heldout_series_uses_only_its_training_ligand_mean
    aggregation: series_macro
    metrics: [centred_RMSE, centred_MAE, Spearman, Kendall_tau, pairwise_concordance]
  transformations_fit_on_outer_training_only: true

nested_selection:
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  ridge_solver: lsqr
  absolute_inner_split: group_kfold_by_frozen_component_5_or_number_available
  scaffold_inner_split: group_kfold_by_frozen_component_5_or_number_available
  selection_metric: RMSE
  tie_break: larger_regularization_then_lexical
  random_projection_is_fixed_and_has_no_fitted_state: true

knn:
  neighbours: [1, 3, 5, 10]
  weights: squared_nonnegative_similarity_else_uniform
  ligand: ECFP_Tanimoto_observation_level
  sequence: ESM2_cosine_series_balanced
  global_structure: S1_USalign_maximum_TM_series_balanced
  pocket_structure: S1_USalign_maximum_TM_series_balanced
  receptor_descriptor: cosine_series_balanced
  tune_k_in_same_nested_split: true

models:
  controls:
    - global_mean
    - target_training_mean_when_seen
    - ECFP_ridge
    - gMolAI_ridge_complete_case
    - pocket_descriptor_ridge
    - ESM_IF1_structure_ridge
    - ESM2_sequence_ridge
    - ECFP_KNN
    - ESM2_sequence_KNN
    - global_structure_KNN
    - pocket_structure_KNN
    - receptor_descriptor_KNN
    - ECFP_ESM2_additive_no_pocket
    - ECFP_receptor_additive_full
    - ECFP_ESM2_receptor_additive_full
    - ECFP_ESM2_receptor_additive_matched_projected
  bilinear:
    design: additive_matched_plus_flattened_ligand_by_receptor_outer_product
    trainable_coefficients_maximum: 1121
    regularizer_and_grid_identical_to_matched_additive: true
  FiLM:
    design: sigmoid_linear_receptor_gate_times_ligand_plus_matched_additive
    hidden_layers: 0
    trainable_parameters_maximum: 2200
    optimizer: AdamW
    learning_rate: 0.01
    weight_decay_grid: [0.0001, 0.001, 0.01]
    maximum_epochs: 500
    early_stopping_patience: 30
    minimum_delta: 0.0001
    nested_validation: deterministic_component_20pct_of_outer_training
  pocket_permutation:
    algorithm: deterministic_Sattolo_derangement_within_available_view
    seed: 20260821
    no_fixed_points: required
  maximum_trainable_interaction_parameters: 50000

uncertainty:
  paired_bootstrap_replicates: 10000
  confidence_level: 0.95
  seed: 20260821
  absolute_unit: frozen_component
  scaffold_unit: assay_series
  probabilities_of_improvement: true

progression:
  primary_candidate: ECFP_ESM2_receptor_bilinear
  comparator: ECFP_ESM2_receptor_additive_matched_projected
  require_for_each_of_pocket_descriptor_and_ESM_IF1_on_S1:
    absolute_support: upper_95pct_CI_of_RMSE_or_MAE_delta_below_zero
    absolute_practical: relative_RMSE_or_MAE_reduction_at_least_0.03
    ranking_support: lower_95pct_CI_of_Spearman_or_concordance_delta_above_zero
    ranking_practical: Spearman_gain_at_least_0.03_or_concordance_gain_at_least_0.02
    remaining_headline_metrics: no_95pct_supported_harm
    pocket_permutation: real_pairing_better_direction
  non_holo_S2:
    both_receptor_encodings_must_show_directional_absolute_and_ranking_gain: true
  gmolai_complete_case:
    S1_direction_must_not_reverse_for_both_receptor_encodings: true
  FiLM:
    reported_as_secondary_replication: true
    cannot_rescue_failed_primary_bilinear: true
  all_conditions_required_for_GO: true
  failure_decision: HYPOTHESIS_NO_GO_terminate_current_no_pose_interaction_architecture
