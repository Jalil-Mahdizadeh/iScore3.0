supersedes: configs/gate03/manual-primary-source-audit-v2.yaml
amendment_reason: >
  Initial publisher-supplement screening showed that several v2 papers place
  exact affinity tables only in their primary manuscript. The final audit
  stratum therefore uses final-series papers whose exact Kd evidence is
  directly inspectable either in an NIH-hosted primary author manuscript or a
  publisher-hosted supplement. This accessibility/mapping decision preceded
  every Gate-3 model fit and used no predictions or model outcomes.
selection_rule: >
  Twelve final-series publications span target classes, publication eras,
  series depths, and affinity ranges. For each series, audit the retained
  observations with the lowest and highest pKd; resolve ties lexically by
  observation_id. Count only primary manuscript or publisher supplement
  evidence, never BindingDB or ChEMBL alone, as verification.
minimum_publications: 12
minimum_consensus_measurements: 24
minimum_verified_fraction: 0.90
