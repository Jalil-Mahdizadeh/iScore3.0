amendment_reason: >
  Direct review found that three v3 extreme observations were not displayed in
  the accessible primary supplement even though their publication association
  exists in BindingDB/ChEMBL. To avoid treating secondary-database agreement as
  primary verification, those publications remain documented unresolved audit
  attempts and are replaced by final-series papers with directly inspectable
  primary tables or figures. This amendment preceded every Gate-3 model fit.
selection_rule: >
  Twelve final-series publications span target classes, eras, series depths,
  and affinity ranges. Audit the lowest and highest retained pKd observation
  per series, with lexical observation_id tie-breaking. Primary NIH manuscript
  or publisher supplement evidence is mandatory; database agreement alone is
  not verification.
minimum_publications: 12
minimum_consensus_measurements: 24
minimum_verified_fraction: 0.90
