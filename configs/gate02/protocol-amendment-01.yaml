rationale: >-
  The predeclared minimum of 20 final union components failed before any Gate-2 model fit.
  Structural, sequence, site, ligand, scaffold, and publication thresholds are deliberately
  retained rather than weakened after inspection. The same frozen RCSB and BindingDB snapshots
  contain additional exact-provenance constructs with two supervised measurements plus an
  independently label-quarantined site-reference structure. These add target diversity without
  relaxing any record-level mapping, coordinate, affinity, or publication requirement.
changes:
  candidate_minimum_supervised_per_construct:
    from: 3
    to: 2
  strict_minimum_exact_measurements_per_construct:
    from: 3
    to: 2
  maximum_constructs:
    from: 50
    to: 80
unchanged:
  - all information-boundary rules
  - BindingDB exact-provenance predicate
  - all ligand, sequence, site, publication, and structural union thresholds
  - all S1/S2 mapping and confidence thresholds
  - sequence and ligand encoders
  - interaction model and additive controls
  - nested OOD evaluation and uncertainty procedure
  - minimum required final union components of 20
  - all go/no-go effect-size and negative-control criteria
reporting_constraint: >-
  Targets with fewer than three measurements are excluded from target-level rank correlations but
  remain valid independent units for pooled component-OOD error and component bootstrap.
