rationale: >-
  The first label-blind expansion increased exact constructs from 36 to 53 but still yielded only
  16 union components because the deliberately conservative structural, sequence, site, ligand,
  scaffold, and publication graph joined 34 related constructs. Weakening those edges after seeing
  the graph would compromise the OOD claim. The same frozen RCSB and BindingDB snapshots contain
  additional exact-provenance constructs with one supervised measurement and an independently
  label-quarantined historical site-reference structure. Such singleton constructs are valid
  held-out component units for pooled error and component bootstrap, although they cannot support
  within-target rank correlation. Mapping and provenance quality remain unchanged.
changes:
  candidate_minimum_supervised_per_construct:
    from: 2
    to: 1
  strict_minimum_exact_measurements_per_construct:
    from: 2
    to: 1
  maximum_constructs:
    from: 80
    to: 160
unchanged:
  - all information-boundary rules
  - BindingDB exact-provenance predicate
  - all record-level coordinate, residue, ligand, target, affinity, and publication checks
  - all ligand, sequence, site, scaffold, publication, and structural union thresholds
  - all S1/S2 mapping and confidence thresholds
  - sequence and ligand encoders
  - interaction model and additive controls
  - nested component-OOD evaluation and uncertainty procedure
  - minimum required final union components of 20
  - all go/no-go effect-size and negative-control criteria
reporting_constraints:
  - targets with fewer than three measurements are excluded from target-level rank correlations
  - singleton targets contribute to pooled component-OOD error and component bootstrap only
  - exact construct count must never be described as independent component count

