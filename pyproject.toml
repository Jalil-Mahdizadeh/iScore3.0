[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iscore3"
version = "0.1.0"
description = "Leakage-aware research tooling for iScore3.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
data = ["xlrd==2.0.2"]
structure = ["biopython>=1.83", "gemmi>=0.6"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
